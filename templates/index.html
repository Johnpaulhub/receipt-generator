
<!DOCTYPE html>
<html>
<head>
    <title>Cyber Café Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 500px; background: #fff; padding: 20px; border-radius: 8px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Digital Cyber Services</h2>
        <p>Fill out your service details and M-Pesa transaction code below:</p>
        <form action="/submit_order" method="POST">
            <label>Full Name:</label>
            <input type="text" name="client_name" placeholder="e.g. John Doe" required>
            
            <label>Phone Number:</label>
            <input type="tel" name="phone" placeholder="e.g. 0712345678" required>
            
            <label>Select Service:</label>
            <select name="service" required>
                <option value="">-- Choose Service --</option>
                <option value="Document Printing">Document Printing</option>
                <option value="CV Typing & Formatting">CV Typing & Formatting</option>
                <option value="KRA / eCitizen Services">KRA / eCitizen Services</option>
                <option value="Photocopy & Scanning">Photocopy & Scanning</option>
            </select>
            
            <label>M-Pesa Transaction Code:</label>
            <input type="text" name="mpesa_code" placeholder="e.g. QHX789PLKM" required style="text-transform: uppercase;">
            
            <button type="submit">Submit Request & Pay</button>
        </form>
        <div style="text-align: center; margin-top: 15px;">
            <a href="/login" style="color: #666; font-size: 14px; text-decoration: none;">Admin Login</a>
        </div>
    </div>
</body>
</html>
